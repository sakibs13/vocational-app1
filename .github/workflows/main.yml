name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Setup Android and Build APK
        working-directory: vocational_physics_app
        run: |
          flutter create . --platforms=android --org com.vocational.physics
          flutter pub get
          flutter build apk --release
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocational-Physics-App-Release
          path: vocational_physics_app/build/app/outputs/flutter-apk/app-release.apk
