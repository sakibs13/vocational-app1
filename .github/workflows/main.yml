name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Android APK
        run: |
          echo "=== ১. প্রজেক্ট ফাইল সংগ্রহ ==="
          if [ ! -f "pubspec.yaml" ] && [ ! -f "vocational_physics_app/pubspec.yaml" ]; then
            git clone https://github.com/sakibs13/vocational-app.git temp_repo
            if [ -d "temp_repo/vocational_physics_app" ]; then
              cp -r temp_repo/vocational_physics_app/* .
            else
              cp -r temp_repo/* .
            fi
            rm -rf temp_repo
          fi

          TARGET_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"

          echo "=== ২. কোড ফিক্স ==="
          find lib/ -name "*.dart" -exec sed -i 's/Colors.emerald/Colors.teal/g' {} + || true

          echo "=== ৩. অ্যান্ড্রয়েড প্ল্যাটফর্ম তৈরি ==="
          flutter create . --project-name=vocational_physics_app --platforms=android --org com.vocational.physics

          echo "=== ৪. অ্যান্ড্রয়েড ম্যানিফেস্ট ফিক্স ==="
          find android/ -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} + || true

          if [ -f "android/gradle.properties" ]; then
            echo "android.enableR8.fullMode=false" >> android/gradle.properties
          fi

          echo "=== ৫. ডিপেনডেন্সি ও প্যাকেজ ইনস্টল ==="
          flutter pub get

          echo "=== ৬. প্লাগইন Proguard ফিক্স (Line 44 Fix) ==="
          find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} + || true

          echo "=== ৭. রিলিজ APK বিল্ড ==="
          flutter build apk --release --no-tree-shake-icons || flutter build apk --debug --no-tree-shake-icons

          echo "=== ৮. তৈরি হওয়া APK ফাইল সংরক্ষণ ==="
          APK_FILE=$(find build/app/outputs/flutter-apk/ -name "*.apk" | head -n 1)
          echo "বিল্ড সফল! ফাইল: $APK_FILE"
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output_apk/vocational_physics.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocational-Physics-App
          path: output_apk/vocational_physics.apk
