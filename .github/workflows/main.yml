name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Fix Android Config and Build APK
        run: |
          echo "=== ১. প্রজেক্ট ফাইল প্রস্তুত করা হচ্ছে ==="
          if [ ! -f "pubspec.yaml" ] && [ ! -f "vocational_physics_app/pubspec.yaml" ]; then
            git clone https://github.com/sakibs13/vocational-app.git temp_repo
            if [ -d "temp_repo/vocational_physics_app" ]; then
              cp -r temp_repo/vocational_physics_app/* .
            else
              cp -r temp_repo/* .
            fi
            rm -rf temp_repo
          fi

          TARGET_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"

          echo "=== ২. অ্যান্ড্রয়েড প্ল্যাটফর্ম কনফিগারেশন ==="
          flutter create . --project-name=vocational_physics_app --platforms=android --org com.vocational.physics

          echo "=== ৩. অ্যান্ড্রয়েড বিল্ড সেটিংস ফিক্স ==="
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i '/android {/a \    lintOptions { abortOnError false; checkReleaseBuilds false }' android/app/build.gradle || true
          fi

          if [ -f "android/gradle.properties" ]; then
            echo "android.enableR8.fullMode=false" >> android/gradle.properties
          fi

          echo "=== ৪. প্যাকেজ ইনস্টল ==="
          flutter pub get

          echo "=== ৫. Proguard প্লাগইন অটো-ফিক্স (Gradle Fix) ==="
          find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} + || true

          echo "=== ৬. APK বিল্ড করা হচ্ছে ==="
          flutter build apk --release --no-tree-shake-icons || flutter build apk --debug --no-tree-shake-icons

          echo "=== ৭. তৈরি হওয়া APK ফাইল সংরক্ষণ ==="
          APK_FILE=$(find build/app/outputs/flutter-apk/ -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output_apk/vocational_physics.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocational-Physics-App
          path: output_apk/vocational_physics.apk
